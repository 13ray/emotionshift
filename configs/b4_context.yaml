# B4: RoBERTa-base with speaker names and the past k turns (Table 4 #5).
# Same optimiser settings as B3 (configs/b3_roberta.yaml) so that B4 - B3 measures
# the effect of context alone. Everything is chosen on DEV only.

seeds: [0, 1, 2, 3, 4]        # headline rows (E1)
sweep_seeds: [0, 1, 2]        # window sweep (E3): proposal asks for 3 seeds
windows: [1, 3, 5, 10, all]   # past turns k; k = 0 is B3

model:
  model_name: roberta-base
  lr: 1.0e-5
  batch_size: 32
  max_len: 256            # truncated from the left: the current utterance is always kept
  warmup: 0.1
  weight_decay: 0.01

epochs:
  meld: 4
  dailydialog: 3

select_on:
  meld: weighted_f1
  dailydialog: micro_f1_no_neutral

# Splits that get predictions (dev is needed to choose k and to report dev strata).
predict_splits:
  meld: [dev, test]
  dailydialog: [dev, test_dedup, test]

# B4+ (fallback improvement R3): B4 at the dev-best k with class-weighted cross-entropy.
b4plus:
  datasets: [meld]
  class_weight: balanced

# The window is swept on MELD only (5 windows x 3 seeds); DailyDialog has 9x the
# training data, so it reuses the window chosen on MELD dev.
sweep_dataset: meld
